[project]
name = "campus-innovation-hub-backend"
version = "0.1.0"
description = "人工智能学院科创与就业服务平台 Django API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.18.0",
    "psycopg[binary]>=3.2,<3.3",
    "gunicorn==23.0.0",
    "Pillow==12.3.0",
    "pillow-avif-plugin==1.6.0",
    "boto3>=1.36,<2",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
]

[tool.uv]
package = false
