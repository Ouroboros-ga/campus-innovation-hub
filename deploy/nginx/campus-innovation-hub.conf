# 仅在获授权的部署中渲染此模板。__PUBLIC_HOST__、TLS 路径、静态/媒体目录
# 与 Admin allowlist 属于环境配置，故意不进入 Git，也不得直接加载未渲染模板。

limit_req_zone $binary_remote_addr zone=campus_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=campus_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=campus_search:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=campus_upload:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PUBLIC_HOST__;

    ssl_certificate __TLS_CERTIFICATE__;
    ssl_certificate_key __TLS_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    root __FRONTEND_DIST__;
    index index.html;
    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 65s;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Report-Only：与实际运行时一致（Nuxt UI 注入内联样式需 unsafe-inline，图标按需从 api.iconify.design / api.simplesvg.com 拉取，首页含 https 外链与 data/blob 图片）
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://api.iconify.design https://api.simplesvg.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /api/auth/login {
        limit_req zone=campus_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location = /api/auth/register {
        limit_req zone=campus_register burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location = /api/search {
        limit_req zone=campus_search burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location = /api/media/upload {
        client_max_body_size 6m;
        limit_req zone=campus_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location = /api/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location /admin/ {
        include __ADMIN_ALLOWLIST_INCLUDE__;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    # 本地媒体只作为静态内容读取；S3 媒体使用其已批准公开 URL。
    location /media/ {
        alias __MEDIA_ROOT__/;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
