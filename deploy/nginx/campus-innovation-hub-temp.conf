# 临时公网 HTTP 站点模板（仅 80，无 TLS）。无域名/无证书窗口期的临时展示。
# 这是模板：由 deploy/scripts/provision-temporary-public.sh 渲染 __PUBLIC_IP__ 后再安装，
# 不得把未渲染模板直接加载到 Nginx。生产公开暴露仍需域名 + TLS + production settings。
#
# 说明：本站点只监听 0.0.0.0:80；Django Admin 由 campus-admin-allow.conf 限制授信来源。

# 每个站点使用独立 zone 名，避免与 loopback/其他站点冲突。
limit_req_zone $binary_remote_addr zone=campus_temp_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=campus_temp_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=campus_temp_search:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=campus_temp_upload:10m rate=10r/m;

server {
    listen 0.0.0.0:80;
    server_name __PUBLIC_IP__;

    root /opt/campus-innovation-hub-dev/current/frontend/dist;
    index index.html;
    client_max_body_size 6m;
    client_body_timeout 15s;
    keepalive_timeout 65s;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /api/auth/login {
        limit_req zone=campus_temp_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }
    location = /api/auth/register {
        limit_req zone=campus_temp_register burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }
    location = /api/search {
        limit_req zone=campus_temp_search burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }
    location = /api/media/upload {
        client_max_body_size 6m;
        limit_req zone=campus_temp_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }
    location = /api/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }
    location /admin/ {
        include /etc/nginx/snippets/campus-admin-allow.conf;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }
    location /static/ {
        alias /var/lib/campus-innovation-hub-dev/static/;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /media/ {
        alias /var/lib/campus-innovation-hub-dev/media/;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
