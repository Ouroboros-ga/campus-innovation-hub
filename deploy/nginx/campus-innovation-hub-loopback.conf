# Loopback-only 内部静态与反代层（无域名阶段，可选）。
# 注意：这不是生产 TLS 模板（见同目录 campus-innovation-hub.conf）。
# 无域名/无 TLS 证书时，不得加载生产 TLS 模板，也不得开放公网 HTTP API。
# 本配置只监听 127.0.0.1:8080，用于在生产形状的请求链下验证 SPA 静态资源、
# /api 反向代理、/media 与安全头，作为公开暴露前的检验基础。
# 公开生产暴露需要域名、TLS、Admin allowlist 与 S3 媒体策略
# （详见 deploy/README.md 与 docs/backend/ProductionReadinessPlan.md）。
#
# 使用方式：
#   1) 安装本文件到 /etc/nginx/sites-available/campus-innovation-hub-loopback 并启用；
#   2) 安装同目录 proxy-headers.conf 到 /etc/nginx/snippets/campus-proxy-headers.conf；
#   3) 先 `nginx -t` 通过后，再 `systemctl enable nginx && systemctl restart nginx`；
#   4) 确认仅 127.0.0.1:8080 监听，0.0.0.0:80/443 未监听。

limit_req_zone $binary_remote_addr zone=campus_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=campus_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=campus_search:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=campus_upload:10m rate=10r/m;

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root /opt/campus-innovation-hub-dev/current/frontend/dist;
    index index.html;
    client_max_body_size 6m;
    client_body_timeout 15s;
    keepalive_timeout 65s;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /api/auth/login {
        limit_req zone=campus_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location = /api/auth/register {
        limit_req zone=campus_register burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location = /api/search {
        limit_req zone=campus_search burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location = /api/media/upload {
        client_max_body_size 6m;
        limit_req zone=campus_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location = /api/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/campus-proxy-headers.conf;
    }

    # 本地媒体只作为静态内容读取；S3 媒体使用其已批准公开 URL。
    location /media/ {
        alias /var/lib/campus-innovation-hub-dev/media/;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
