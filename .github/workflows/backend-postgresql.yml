name: 后端 PostgreSQL 验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-postgresql:
    name: Django / PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.2-alpine
        env:
          POSTGRES_DB: campus_innovation_hub
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus_ci_password
        options: >-
          --health-cmd "pg_isready -U campus -d campus_innovation_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: github-actions-test-secret-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/development.txt

      - name: 检查、迁移与测试
        env:
          DATABASE_URL: postgresql://campus:campus_ci_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/campus_innovation_hub
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          python manage.py test -v 1
